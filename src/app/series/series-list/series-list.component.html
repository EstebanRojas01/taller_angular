<div class="container mt-5">
  <!-- Encabezado -->
  <div class="header">
    <h1>TV Series</h1>
  </div>

  <!-- Distribución en dos columnas -->
  <div class="row">
    <!-- Columna izquierda: Tabla de series -->
    <div class="col-md-7">
      <table class="table table-striped table-bordered custom-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Canal</th>
            <th>Temporadas</th>
          </tr>
        </thead>
        <tbody>
          <tr onkeydown="return false;"
            *ngFor="let serie of series; let i = index"
            (click)="toggleDetails(i)"
            [class.table-active]="selectedSerie === serie"
            style="cursor: pointer;"
            
          >
            <td>{{ serie.id }}</td>
            <td>{{ serie.name }}</td>
            <td>{{ serie.channel }}</td>
            <td>{{ serie.seasons }}</td>
          </tr>
        </tbody>
      </table>
      <div id="average-seasons" class="mt-3 font-weight-bold">
        Promedio de temporadas: {{ averageSeasons | number:'1.0-2' }}
      </div>
    </div>

    <!-- Columna derecha: Detalles de la serie seleccionada -->
    <div class="col-md-5">
      <div id="serie-detail" class="p-3 border bg-light">
        <ng-container *ngIf="selectedSerie !== null; else sinSeleccion">
          <div class="card-im" style="width: 100%;">
            
            <img
              [src]="selectedSerie.poster"
              [alt]="selectedSerie.name"
              class="card-img-top"
              style="max-height: 200px; object-fit: cover;"
            />
            <div class="card-body">
              <h5 class="card-title">{{ selectedSerie.name }}</h5>
              <p class="card-text">
                {{ selectedSerie.description }}
              </p>
              <a
                [href]="selectedSerie.webpage"
                target="_blank"
                rel="noopener noreferrer"
                class="btn btn-info btn-sm"
              >
                Ver más
              </a>
            </div>
          </div>
        </ng-container>
        <ng-template #sinSeleccion>
          <p class="text-muted">Seleccione una serie para ver detalles.</p>
        </ng-template>
      </div>
    </div>
  </div>
</div>
